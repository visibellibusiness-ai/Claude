name: Test generazione immagini

# Prova temporanea: genera alcune immagini con modelli open source sulla CPU
# del server di GitHub e le salva in posts/image-tests/ per valutarle.
on:
  push:
    paths:
      - ".github/workflows/image-test.yml"
      - "bot/imagegen.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installa PyTorch (CPU) e diffusers
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install diffusers transformers accelerate peft safetensors pillow

      - name: Genera le immagini di prova
        run: |
          python - <<'EOF'
          import json, platform, os
          from pathlib import Path
          from bot.imagegen import generate
          prompts = {
              "rates": "a single golden key balanced on a stack of old coins, a thin thread holding it still",
              "battery": "a glowing smartphone battery lifted out of an open phone like a jewel from a box",
              "comet": "a bright comet streaking over a quiet hill with a lone telescope",
          }
          out = Path("posts/image-tests")
          report = {"cpu": os.cpu_count(), "python": platform.python_version(), "results": []}
          for model in ["sd-turbo", "vega"]:
              for name, p in prompts.items():
                  try:
                      t = generate(p, out / f"{model}_{name}.jpg", model=model)
                      report["results"].append({"model": model, "name": name, **t})
                  except Exception as e:
                      report["results"].append({"model": model, "name": name, "error": repr(e)[:500]})
                  print(report["results"][-1], flush=True)
          (out / "report.json").write_text(json.dumps(report, indent=2))
          EOF

      - name: Salva i risultati
        if: always()
        run: |
          git config user.name "instagram-bot"
          git config user.email "instagram-bot@users.noreply.github.com"
          git add posts/image-tests || true
          git diff --cached --quiet || git commit -m "Test immagini: risultati"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push
