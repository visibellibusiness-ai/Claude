name: Sonda piattaforme risultati live

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URL da sondare, separati da spazio (vuoto = default in live/probe.py)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Sonda le pagine
        run: python -m live.probe ${{ inputs.urls }}

      - name: Carica le pagine scaricate
        uses: actions/upload-artifact@v4
        with:
          name: probe-out
          path: probe_out/
          retention-days: 5

      # Le stesse pagine vanno sul branch "probe" (riscritto a ogni giro, come "media"):
      # la sessione cloud ha la rete chiusa ma GitHub lo raggiunge, così il parser si
      # sviluppa in locale su pagine vere.
      - name: Pubblica le pagine sul branch probe
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd probe_out
          git init -q -b probe
          git config user.name "live-probe"
          git config user.email "live-probe@users.noreply.github.com"
          git add -A
          git commit -q -m "Pagine della sonda"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" probe
