name: Prova verifica account da taggare

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Verifica alcuni account (solo lettura)
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          python - <<'PY'
          import os, requests
          uid, tok = os.environ["IG_USER_ID"], os.environ["IG_ACCESS_TOKEN"]
          for ver in ["v26.0", "v23.0"]:
              for host in ["graph.instagram.com", "graph.facebook.com"]:
                  r = requests.get(f"https://{host}/{ver}/{uid}", params={"fields": "business_discovery.username(nasa){username,name,followers_count}", "access_token": tok}, timeout=30)
                  print("RISULTATO", host, ver, r.status_code, r.text[:400])
          r = requests.get(f"https://graph.instagram.com/v26.0/{uid}", params={"fields": "username,account_type", "access_token": tok}, timeout=30)
          print("RISULTATO me", r.status_code, r.text[:300])
          PY
