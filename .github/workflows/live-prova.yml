name: Prova pubblicazione live su you.didnot.know

on:
  workflow_dispatch:
    inputs:
      limite:
        description: "Quanti contenuti della coda pubblicare (0 = tutti)"
        type: string
        default: "5"
      salta:
        description: "Quanti contenuti della coda saltare dall'inizio"
        type: string
        default: "0"

permissions:
  contents: read

concurrency:
  group: live-prova
  cancel-in-progress: false

jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install requests pillow

      # Prova richiesta da Andrea: stesse Story del tool, pubblicate sull'account di
      # collaudo @you.didnot.know (chiavi già nei secrets) per verificare eventuali
      # blocchi dell'API. La coda resta intatta (LIVE_PROVA=1).
      - name: Pubblica in modalità prova
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEDIA_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}
          LIVE_PROVA: "1"
          LIVE_LIMITE: ${{ inputs.limite }}
          LIVE_SALTA: ${{ inputs.salta }}
        run: python -m live.main publish
