name: Pubblica post Instagram

on:
  schedule:
    # 13:40 UTC (pomeriggio in Europa, mattina negli USA)
    # 23:40 UTC (sera negli USA)
    - cron: "40 13 * * *"
    - cron: "40 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Controlla che le chiavi siano configurate
        id: check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ] && [ -n "$IG_USER_ID" ] && [ -n "$IG_ACCESS_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Chiavi mancanti (vedi README): giro saltato"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-python@v6
        if: steps.check.outputs.ready == 'true'
        with:
          python-version: "3.12"

      - if: steps.check.outputs.ready == 'true'
        run: pip install -r requirements.txt

      - name: Leggi le statistiche e aggiorna la strategia
        if: steps.check.outputs.ready == 'true'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python -m bot.main learn

      - name: Genera e disegna il post
        if: steps.check.outputs.ready == 'true' && hashFiles('posts/pending.json') == ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m bot.main create

      - name: Metti online le immagini
        if: steps.check.outputs.ready == 'true'
        run: |
          git config user.name "instagram-bot"
          git config user.email "instagram-bot@users.noreply.github.com"
          git add posts
          git diff --cached --quiet || git commit -m "Nuovo post generato"
          git push
          sleep 20

      - name: Pubblica su Instagram
        if: steps.check.outputs.ready == 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEDIA_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}
        run: python -m bot.main publish

      - name: Aggiorna lo storico
        if: always() && steps.check.outputs.ready == 'true'
        run: |
          git add -A posts
          git diff --cached --quiet || git commit -m "Post pubblicato"
          git push
