name: Pubblica post Instagram

on:
  schedule:
    # 12:35 UTC: rubrica news (mattina negli USA, primo pomeriggio in Europa)
    - cron: "35 12 * * *"
    # 17:40 e 23:40 UTC: curiosità (sera in Europa, pomeriggio e sera negli USA)
    - cron: "40 17 * * *"
    - cron: "40 23 * * *"
  workflow_dispatch:
    inputs:
      series:
        description: "Cosa pubblicare"
        type: choice
        options: [facts, news]
        default: facts

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Controlla che le chiavi siano configurate
        id: check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ] && [ -n "$IG_USER_ID" ] && [ -n "$IG_ACCESS_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Chiavi mancanti (vedi README): giro saltato"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-python@v6
        if: steps.check.outputs.ready == 'true'
        with:
          python-version: "3.12"

      - name: Recupera il modello di immagini salvato
        if: steps.check.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-segmind-vega-v1

      - if: steps.check.outputs.ready == 'true'
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Leggi le statistiche e aggiorna la strategia
        if: steps.check.outputs.ready == 'true'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python -m bot.main learn

      - name: Scegli la serie
        if: steps.check.outputs.ready == 'true'
        id: series
        run: |
          if [ "${{ github.event.schedule }}" = "35 12 * * *" ] || [ "${{ inputs.series }}" = "news" ]; then
            echo "name=news" >> "$GITHUB_OUTPUT"
          else
            echo "name=facts" >> "$GITHUB_OUTPUT"
          fi

      - name: Genera e disegna il post
        if: steps.check.outputs.ready == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # facoltative: più foto tra cui scegliere
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: python -m bot.main create --series ${{ steps.series.outputs.name }}

      - name: Metti online le immagini
        if: steps.check.outputs.ready == 'true'
        run: |
          git config user.name "instagram-bot"
          git config user.email "instagram-bot@users.noreply.github.com"
          git add posts
          git diff --cached --quiet || git commit -m "Nuovo post generato"
          git push
          sleep 20

      - name: Pubblica su Instagram
        if: steps.check.outputs.ready == 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEDIA_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}
        run: python -m bot.main publish --series ${{ steps.series.outputs.name }}

      - name: Aggiorna lo storico
        if: always() && steps.check.outputs.ready == 'true'
        run: |
          git add -A posts
          git diff --cached --quiet || git commit -m "Post pubblicato"
          git push
